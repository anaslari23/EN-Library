[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "en"
version = "0.3.0"
description = "Write code in plain English, offline: an English-like language, interpreter, and comment-driven code generator"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "anaslari23" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/anaslari23/EN-Library"

[project.scripts]
codeinenglish = "codeinenglish.__main__:main"
en = "codeinenglish.__main__:main"
